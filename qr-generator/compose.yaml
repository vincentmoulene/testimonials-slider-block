services:
    app:
        build:
            context: .
            target: app
        ports:
            - "8080:80"
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET:-change-me-in-production}
            SITE_NAME: ${SITE_NAME:-QRLab}
            SITE_URL: ${SITE_URL:-http://localhost:8080}
            CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@example.com}
            ADSENSE_ENABLED: ${ADSENSE_ENABLED:-0}
            ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
            ANALYTICS_ID: ${ANALYTICS_ID:-}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
            LEAD_CAPTURE_MODE: ${LEAD_CAPTURE_MODE:-download}
            DATABASE_URL: ${DATABASE_URL:-sqlite:////app/var/data/app.db}
        volumes:
            # Keeps the collected email addresses across redeploys.
            - qr-data:/app/var/data
        restart: unless-stopped

volumes:
    qr-data:

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
