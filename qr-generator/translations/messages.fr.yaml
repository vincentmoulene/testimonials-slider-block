home:
    meta_title: 'Générateur de QR code gratuit — sans inscription ni expiration | %site%'
    meta_description: 'Créez un QR code gratuit à partir d''une URL, d''un texte, d''un Wi-Fi, d''une vCard, d''un e-mail ou d''un numéro. Téléchargement PNG, SVG et WebP haute résolution, sans compte et sans date d''expiration.'
    eyebrow: 'Générateur de QR code gratuit'
    h1: 'Créez un QR code gratuit en quelques secondes'
    lead: 'Collez un lien, un texte — ce que vous voulez — et obtenez un QR code haute résolution à télécharger en PNG, SVG ou WebP. Sans compte, sans filigrane, sans expiration et avec un usage commercial illimité.'
    tools_title: 'Tous les générateurs, tous gratuits'
    tools_subtitle: 'Dix-neuf générateurs spécialisés : liens, Wi-Fi, cartes de visite, événements, avis Google, virements SEPA, double authentification, paiements crypto et codes-barres.'
    why_title: 'Pourquoi utiliser ce générateur'
    why:
        free:
            title: 'Gratuit et illimité'
            text: 'Aucun quota, aucun formulaire d''inscription, aucune carte bancaire. La publicité finance le service pour que les outils restent ouverts à tous.'
        privacy:
            title: 'Respect de la vie privée'
            text: 'Les codes sont générés à la volée et jamais stockés. Pas de compte, aucun suivi de ce que vous encodez, aucun script tiers avant votre consentement.'
        quality:
            title: 'Qualité prête à imprimer'
            text: 'Téléchargez un SVG vectoriel pour vos affiches et emballages, ou un PNG jusqu''à 1024 px. Choisissez le niveau de correction d''erreurs pour que le code reste lisible même abîmé.'
        speed:
            title: 'Compatible partout'
            text: 'Les codes statiques respectent les standards lus nativement par les appareils photo iOS et Android : aucune redirection, aucun domaine de tracking, rien qui puisse casser plus tard.'
    copy_title: 'Tout ce qu''il faut savoir sur les QR codes'
    copy_body: |
        <p>Un QR code est un code-barres en deux dimensions qui stocke du texte — le plus souvent une adresse web. Tous les smartphones récents le lisent directement depuis l''appareil photo, ce qui en fait le pont le plus rapide entre un support imprimé et une page web : affiche, carte de visite, menu de restaurant, colis ou étiquette produit.</p>
        <p>Les codes produits ici sont <strong>statiques</strong> : la destination est inscrite dans le motif lui-même. Une fois l''image téléchargée, plus rien ne dépend de nos serveurs, si bien qu''un code imprimé aujourd''hui fonctionnera encore dans dix ans — même si ce site disparaît. Les codes dits dynamiques vendus ailleurs font transiter chaque scan par un domaine tiers, qui peut être coupé, facturé au mois ou transformé en mouchard.</p>
        <p>Pour l''impression, exportez toujours le SVG : il reste parfaitement net à n''importe quelle taille. Conservez une zone de silence (la marge blanche) d''au moins quatre modules autour du code, n''inversez jamais le contraste (un motif sombre sur fond clair se scanne le mieux) et testez le fichier final avec deux ou trois téléphones avant de l''envoyer à l''imprimeur.</p>

