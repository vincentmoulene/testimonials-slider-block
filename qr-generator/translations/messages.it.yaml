home:
    meta_title: 'Generatore di QR code gratuito — senza registrazione né scadenza | %site%'
    meta_description: 'Crea gratis un QR code da un URL, un testo, il Wi-Fi, una vCard, un''e-mail o un numero di telefono. Download PNG, SVG e WebP ad alta risoluzione, senza account e senza scadenza.'
    eyebrow: 'Generatore di QR code gratuito'
    h1: 'Crea un QR code gratuito in pochi secondi'
    lead: 'Incolla un link, un testo — quello che vuoi — e ottieni un QR code ad alta risoluzione da scaricare in PNG, SVG o WebP. Senza account, senza filigrana, senza scadenza e con uso commerciale illimitato.'
    tools_title: 'Tutti i generatori, tutti gratuiti'
    tools_subtitle: 'Diciannove generatori specializzati: link, Wi-Fi, biglietti da visita, eventi, recensioni Google, bonifici SEPA, autenticazione a due fattori, pagamenti crypto e codici a barre.'
    why_title: 'Perché usare questo generatore'
    why:
        free:
            title: 'Gratuito e illimitato'
            text: 'Nessuna quota, nessun modulo di registrazione, nessuna carta di credito. La pubblicità finanzia il servizio perché gli strumenti restino aperti a tutti.'
        privacy:
            title: 'Privacy fin dalla progettazione'
            text: 'I codici sono generati al momento e mai memorizzati. Nessun account, nessun tracciamento di ciò che codifichi, nessuno script di terze parti prima del tuo consenso.'
        quality:
            title: 'Qualità pronta per la stampa'
            text: 'Scarica un SVG vettoriale per manifesti e confezioni, oppure un PNG fino a 1024 px. Scegli il livello di correzione degli errori perché il codice resti leggibile anche se rovinato.'
        speed:
            title: 'Funziona ovunque'
            text: 'I codici statici seguono gli standard letti nativamente dalle fotocamere iOS e Android: nessun reindirizzamento, nessun dominio di tracciamento, nulla che possa rompersi in seguito.'
    copy_title: 'Tutto quello che serve sapere sui QR code'
    copy_body: |
        <p>Un QR code è un codice a barre bidimensionale che memorizza del testo, quasi sempre un indirizzo web. Ogni smartphone recente lo legge direttamente dalla fotocamera: è il ponte più rapido tra un supporto stampato e una pagina web — un manifesto, un biglietto da visita, un menu, un pacco o un''etichetta di prodotto.</p>
        <p>I codici generati qui sono <strong>statici</strong>: la destinazione è scritta nel motivo stesso. Una volta scaricata l''immagine nulla dipende più dai nostri server, quindi un codice stampato oggi funzionerà anche fra dieci anni, anche se questo sito non esisterà più. I codici dinamici venduti altrove fanno passare ogni scansione da un dominio di terzi, che può essere spento, fatturato a mese o trasformato in un tracciatore.</p>
        <p>Per la stampa esporta sempre l''SVG: resta nitido a qualsiasi dimensione. Mantieni una zona di silenzio (il margine bianco) di almeno quattro moduli attorno al codice, non invertire mai il contrasto (motivo scuro su fondo chiaro) e prova il file finale con due o tre telefoni prima di mandarlo in stampa.</p>

