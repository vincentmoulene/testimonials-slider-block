faq:
    title: 'Frequently asked questions'
    free:
        q: 'Is this generator really free?'
        a: 'Yes. Every generator on this site is free and unlimited, with no account and no watermark. The site is funded by advertising, which is why the ads only load after you accept them.'
    expire:
        q: 'Do the codes expire?'
        a: 'Never. The codes are static: the content is encoded in the pattern itself, not stored on our servers. Once downloaded, a code keeps working even if this website disappears.'
    commercial:
        q: 'Can I use the codes commercially?'
        a: 'Yes, without restriction: packaging, posters, business cards, products for sale. You own the generated image and owe us nothing — no royalties, no attribution.'
    print:
        q: 'What size should I print a code at?'
        a: 'A rule of thumb: the code should be at least a tenth of the scanning distance. For a scan at 50 cm, print at least 5 cm wide. Always export the SVG for print, keep the quiet margin and test with two or three phones.'
    url:
        q: 'Can I change the destination of my QR code later?'
        a: 'Not on a static code — the URL is inside the pattern. If you need to change it later, encode a link you control (your own domain, a page that redirects) so you can change the redirect instead of reprinting.'
    text:
        q: 'How much text can a QR code hold?'
        a: 'Technically up to about 4,000 characters, but readability drops fast. Stay under 300 characters for a code that scans instantly, and raise the error-correction level if you go beyond that.'
    wifi:
        q: 'Which phones can join a network from a QR code?'
        a: 'iPhones since iOS 11 and Android devices since version 10 handle it natively from the camera app. Older Android phones may need a QR reader app that supports Wi-Fi codes.'
    vcard:
        q: 'Which format is used for the contact card?'
        a: 'vCard 3.0, the format supported by iOS, Android, Outlook, Gmail and every mainstream address book. Nothing to install on the other person’s phone.'
    email:
        q: 'Does the scan send the email automatically?'
        a: 'No, and that is deliberate: the scan opens the mail app with everything pre-filled, and the visitor presses send. They can still edit the message first.'
    sms:
        q: 'Does the SMS cost anything to the person scanning?'
        a: 'The message is sent from their own phone, so their usual plan applies. Nothing is charged by this site, and the code works even without a data connection.'
    phone:
        q: 'Does the call start on its own?'
        a: 'No. The scan opens the dialler with the number already filled in; the person taps the call button. This is a safety rule enforced by iOS and Android.'
    whatsapp:
        q: 'Do I need a WhatsApp Business account?'
        a: 'No. The code opens a standard wa.me conversation that works with any WhatsApp account, personal or business.'
    geo:
        q: 'Which app opens when the code is scanned?'
        a: 'The phone’s default map app — Apple Maps on iOS, Google Maps on most Android devices. The coordinates are handed over in the standard geo: format.'
    barcode:
        q: 'Can I invent my own EAN-13 number?'
        a: 'Not for retail. An EAN-13 sold in shops must come from a GS1 prefix assigned to your company. For internal use — stock, assets, internal logistics — you are free to number as you like, and Code 128 is usually the better fit.'
    event:
        q: 'Which calendars accept the code?'
        a: 'The scan opens the native calendar on iOS and Android, which then syncs to Google Calendar, iCloud or Outlook as usual. The encoded format is the standard VEVENT.'
    review:
        q: 'Can I show the code only to happy customers?'
        a: 'No. Filtering who is invited to review — "review gating" — breaks Google''s policy and can get your profile suspended. Show the same code to everyone, and ask at the moment the service went well.'
    bitcoin:
        q: 'Is the amount locked into the code?'
        a: 'It is a suggestion: the wallet pre-fills it and the payer can still change it before signing. Leave the field empty for a donation, fill it in for an invoice.'

