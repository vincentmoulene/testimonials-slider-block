home:
    meta_title: 'Free QR Code Generator — no sign-up, no expiry | %site%'
    meta_description: 'Create a free QR code from a URL, text, Wi-Fi, vCard, email or phone number. High-resolution PNG, SVG and WebP downloads, no account and no expiry date.'
    eyebrow: 'Free QR code generator'
    h1: 'Create a free QR code in seconds'
    lead: 'Paste a link, a text — anything — and get a high-resolution QR code to download as PNG, SVG or WebP. No account, no watermark, no expiry, and unlimited commercial use.'
    tools_title: 'Every generator, all free'
    tools_subtitle: 'Thirteen specialised generators for links, Wi-Fi, contact cards, events, Google reviews, payments and retail barcodes.'
    why_title: 'Why use this generator'
    why:
        free:
            title: 'Free and unlimited'
            text: 'No quota, no sign-up form and no credit card. Ads keep the service running so the tools stay open to everyone.'
        privacy:
            title: 'Privacy by design'
            text: 'Codes are generated on the fly and never stored. No account, no tracking of what you encode, no third-party script before your consent.'
        quality:
            title: 'Print-ready quality'
            text: 'Download vector SVG for posters and packaging, or PNG up to 1024 px. Pick the error-correction level so your code still scans when partly damaged.'
        speed:
            title: 'Works everywhere'
            text: 'Static codes follow the standards used by native iOS and Android cameras — no redirect, no tracking domain, nothing to break later.'
    copy_title: 'Everything you need to know about QR codes'
    copy_body: |
        <p>A QR code is a two-dimensional barcode that stores text — most often a URL. Every recent smartphone reads one straight from the camera app, which makes it the fastest bridge between a printed medium and a web page: a poster, a business card, a restaurant menu, a parcel or a product label.</p>
        <p>The codes produced here are <strong>static</strong>: the destination is encoded in the pattern itself. Nothing depends on our servers once the image is downloaded, so a code printed today still works in ten years — even if this website disappears. Dynamic codes sold elsewhere route every scan through a third-party domain that can be switched off, rented monthly or turned into a tracking pixel.</p>
        <p>For print, always export the SVG: it stays razor-sharp at any size. Keep a quiet zone (the white margin) of at least four modules around the code, never invert the contrast (dark pattern on a light background scans best), and test the final artwork with two or three phones before sending it to the printer.</p>

tools:
    meta_title: 'All free QR code and barcode generators'
    meta_description: 'Thirteen free generators: URL, plain text, Wi-Fi, vCard, email, SMS, phone, WhatsApp, location, calendar event, Google review, Bitcoin and retail barcodes. PNG, SVG and WebP downloads.'
    h1: 'All our free generators'
    lead: 'Pick the type of code you need. Every generator is free, unlimited and works without an account.'
    grid_title: 'Generators'

tool:
    other_tools: 'Other free generators'
    qrcode:
        name: 'QR code generator'
        object: 'QR code'
        form_title: 'What should the code contain?'
    url:
        name: 'URL QR code generator'
        object: 'URL QR code'
        short: 'Turn any link into a scannable code.'
        meta_title: 'Free URL QR Code Generator'
        meta_description: 'Turn any link into a free QR code. Download PNG, SVG or WebP in high resolution — no account, no watermark and no expiry date.'
        form_title: 'Your link'
        intro: 'Paste a link and download a QR code that opens it instantly on any phone. Free, unlimited and permanent.'
        copy_title: 'Linking a printed medium to a web page'
        copy_body: |
            <p>A URL QR code is the most common use case: it opens a page as soon as it is scanned, with no typing and no error. Use it on packaging to link to instructions, on a poster to open a booking form, on a flyer to reach your shop, or on an invoice to open the payment page.</p>
            <p>Keep the encoded URL short — a shorter link means fewer modules, a bigger pattern and an easier scan from a distance. Prefer a clean, readable address to a long string of tracking parameters, and always test the printed result at the real size and distance where people will scan it.</p>
    text:
        name: 'Text QR code generator'
        object: 'text QR code'
        short: 'Encode any plain text, offline.'
        meta_title: 'Free Text QR Code Generator'
        meta_description: 'Encode any plain text in a free QR code: a message, a serial number, a Wi-Fi password or instructions. PNG, SVG and WebP downloads.'
        form_title: 'Your text'
        intro: 'Encode a message, a reference or a set of instructions. The text is stored inside the code itself and stays readable offline.'
        copy_title: 'When plain text beats a link'
        copy_body: |
            <p>A text QR code needs no network: the phone displays the content immediately, even in a basement, a warehouse or a plane. That makes it ideal for machine serial numbers, maintenance instructions, shelf references, event details or a short message on a gift.</p>
            <p>Keep it concise. Below roughly 300 characters the pattern stays comfortable to scan; beyond 1000 it becomes dense and needs a larger print size and a higher error-correction level.</p>
    wifi:
        name: 'Wi-Fi QR code generator'
        object: 'Wi-Fi QR code'
        short: 'Guests connect without typing a password.'
        meta_title: 'Free Wi-Fi QR Code Generator'
        meta_description: 'Create a free Wi-Fi QR code: your guests scan it and connect without typing the password. Works on iOS and Android. PNG and SVG downloads.'
        form_title: 'Your Wi-Fi network'
        intro: 'Print the code, stick it on the wall: guests scan it and join your network without ever seeing the password typed out.'
        copy_title: 'The right way to share a Wi-Fi network'
        copy_body: |
            <p>Since iOS 11 and Android 10, the camera recognises a Wi-Fi QR code and offers to join the network in one tap. Hotels, cafés, coworking spaces, waiting rooms and holiday rentals use it to stop dictating a twenty-character password all day long.</p>
            <p>Type the network name exactly as it is broadcast — SSIDs are case-sensitive. Pick WPA for any modern router (WPA2 and WPA3 use the same setting), and tick "hidden network" only if the SSID is genuinely not broadcast, otherwise some phones will fail to connect.</p>
    vcard:
        name: 'vCard QR code generator'
        object: 'vCard QR code'
        short: 'Share your contact details in one scan.'
        meta_title: 'Free vCard QR Code Generator (contact card)'
        meta_description: 'Create a free vCard QR code with your name, phone, email and company. One scan adds you to any phone contact list. PNG and SVG downloads.'
        form_title: 'Your contact details'
        intro: 'One scan and your details land straight in the other person’s address book — no typing, no typo, no app.'
        copy_title: 'The business card that survives the pocket'
        copy_body: |
            <p>A vCard QR code encodes a standard contact file (vCard 3.0), understood by iOS, Android, Outlook and every modern address book. Print it on your business card, add it to an email signature, a conference badge or a shop window.</p>
            <p>Include only what you want to hand out publicly: a name, a phone number, a professional email and a website are usually enough. The fewer fields you add, the lighter the pattern and the faster the scan.</p>
    email:
        name: 'Email QR code generator'
        object: 'email QR code'
        short: 'Open a pre-filled email in one scan.'
        meta_title: 'Free Email QR Code Generator'
        meta_description: 'Create a free QR code that opens a pre-filled email with subject and message. Ideal for support, quotes and feedback. PNG and SVG downloads.'
        form_title: 'Your email'
        intro: 'The scan opens the mail app with your address, subject and message already filled in. All the visitor has to do is press send.'
        copy_title: 'Removing friction from every request'
        copy_body: |
            <p>Pre-filling the subject line turns a vague inbox into a sorted one: "Quote request — poster campaign" tells you where the message comes from before you even open it. Print the code on a leaflet, a delivery note, a piece of equipment or an exhibition stand.</p>
            <p>Keep the pre-filled body short and neutral: it is a starting point, not a script. The visitor can always edit it before sending.</p>
    sms:
        name: 'SMS QR code generator'
        object: 'SMS QR code'
        short: 'Pre-fill a text message.'
        meta_title: 'Free SMS QR Code Generator'
        meta_description: 'Create a free QR code that opens a pre-filled SMS to your number. Perfect for votes, orders and support. PNG and SVG downloads.'
        form_title: 'Your SMS'
        intro: 'The scan opens the messaging app with your number and message ready to send.'
        copy_title: 'A universal channel, no app required'
        copy_body: |
            <p>SMS works on every phone, without an account, an app or a data connection. That makes an SMS QR code a reliable choice for a vote, a table order, a callback request or a stock check in a shop.</p>
            <p>Always write the number in international format (+ country code): a national format only works for people whose phone is registered in the same country.</p>
    phone:
        name: 'Phone QR code generator'
        object: 'phone QR code'
        short: 'One scan starts the call.'
        meta_title: 'Free Phone Number QR Code Generator'
        meta_description: 'Create a free QR code that dials your phone number when scanned. Ideal for shop windows, vehicles and adverts. PNG and SVG downloads.'
        form_title: 'Your phone number'
        intro: 'The scan opens the dialler with your number already entered — no typing, no wrong digit.'
        copy_title: 'Where a phone code beats a link'
        copy_body: |
            <p>On a van, a shop window, a for-sale sign or a machine that needs servicing, calling is faster than browsing. A phone QR code removes the transcription step, which is exactly where prospects give up.</p>
            <p>Use the international format (+ country code) so the number works for visitors and roaming customers, and place the code at eye level so it can be scanned from a couple of metres away.</p>
    whatsapp:
        name: 'WhatsApp QR code generator'
        object: 'WhatsApp QR code'
        short: 'Start a WhatsApp chat instantly.'
        meta_title: 'Free WhatsApp QR Code Generator'
        meta_description: 'Create a free QR code that opens a WhatsApp conversation with a pre-filled message. No WhatsApp Business account required. PNG and SVG downloads.'
        form_title: 'Your WhatsApp conversation'
        intro: 'The scan opens a WhatsApp conversation with your number and, if you want, a ready-to-send message.'
        copy_title: 'A conversation instead of a form'
        copy_body: |
            <p>WhatsApp has become the default customer channel in much of Europe, Latin America and Asia. A QR code that opens a pre-filled conversation ("Hi, I would like a quote for…") converts far better than a contact form nobody wants to fill in on a phone.</p>
            <p>This generator builds a standard wa.me link, so it works with a personal account as well as with WhatsApp Business — no subscription, no verification, nothing to renew.</p>
    geo:
        name: 'Location QR code generator'
        object: 'location QR code'
        short: 'Open a map at the right coordinates.'
        meta_title: 'Free Location QR Code Generator (GPS)'
        meta_description: 'Create a free QR code that opens a map at your GPS coordinates. Perfect for venues, meeting points and deliveries. PNG and SVG downloads.'
        form_title: 'Your coordinates'
        intro: 'The scan opens the phone’s map app directly at the coordinates you entered.'
        copy_title: 'Guiding people to a point, not an address'
        copy_body: |
            <p>Some places have no usable street address: a festival entrance, a delivery gate, a trailhead, a plot of land, a meeting point in a car park. GPS coordinates describe them exactly, and a geo QR code hands them to the map app in one scan.</p>
            <p>Copy the latitude and longitude from any mapping service (right-click on the point) and paste them here in decimal degrees, for example 48.8584 and 2.2945.</p>
    barcode:
        name: 'Barcode generator'
        object: 'barcode'
        short: 'EAN-13, UPC-A, Code 128 and more.'
        meta_title: 'Free Barcode Generator (EAN-13, UPC, Code 128)'
        meta_description: 'Create free EAN-13, EAN-8, UPC-A, Code 128, Code 39 and ITF-14 barcodes. Vector SVG export for print. No account required.'
        form_title: 'Your barcode'
        intro: 'Generate a retail or logistics barcode and export it as a vector file, ready for packaging and labels.'
        copy_title: 'Choosing the right symbology'
        copy_body: |
            <p>EAN-13 is the standard for retail products in Europe (12 digits plus a check digit), UPC-A its North American equivalent, and EAN-8 the compact version for small packaging. Code 128 encodes letters and digits and drives most internal logistics; Code 39 remains common in industry; ITF-14 identifies shipping cartons.</p>
            <p>Export the SVG for printing: a barcode is read by its bar widths, so any rescaling of a bitmap risks making it unreadable. Keep the bars black on white, respect the quiet zones on both sides and never print it below 80% of the nominal size.</p>
    event:
        name: 'Event QR code generator'
        object: 'event QR code'
        short: 'Add an event to any calendar in one scan.'
        meta_title: 'Free Event QR Code Generator (calendar)'
        meta_description: 'Create a free QR code that adds your event to the calendar of whoever scans it: date, time and location included. PNG and SVG downloads.'
        form_title: 'Your event'
        intro: 'One scan and your event lands in the calendar of the person in front of you — right date, right time, right address.'
        copy_title: 'Getting a date into people''s calendars'
        copy_body: |
            <p>An invitation only works once it is in the calendar. An event QR code encodes a standard calendar entry (VEVENT), so scanning it opens the phone's calendar app with everything pre-filled: title, start, end and location. Print it on an invitation, a concert poster, a training programme, a save-the-date or a conference badge.</p>
            <p>Times are encoded as local time, exactly as you type them: the reader shows the event as written, wherever the person is. For a recurring event, generate one code per date rather than encoding a repeat rule — it scans far more reliably.</p>
    review:
        name: 'Google review QR code generator'
        object: 'review QR code'
        short: 'Send customers straight to your review form.'
        meta_title: 'Free Google Review QR Code Generator'
        meta_description: 'Create a free QR code that opens your Google review form directly. Perfect for receipts, tables and counters. PNG and SVG downloads.'
        form_title: 'Your review link'
        intro: 'Turn a satisfied customer into a review while they are still in front of you: the scan opens the rating form directly.'
        copy_title: 'Where to find your review link'
        copy_body: |
            <p>Open your Google Business Profile, click <em>Ask for reviews</em>, and copy the short link Google gives you (it looks like <code>g.page/r/…/review</code>). Paste it here and you get a code that opens the star rating form directly — no search, no menu, no wrong business picked by mistake.</p>
            <p>Placement matters more than design: on the receipt, on the table tent, on the counter next to the card reader, or in the invoice you email. Ask at the moment the customer is happy — right after the service — not three days later. And never filter who gets to scan it: gating reviews by expected rating is against Google's policy and gets profiles suspended.</p>
    bitcoin:
        name: 'Bitcoin QR code generator'
        object: 'Bitcoin QR code'
        short: 'Get paid without anyone typing an address.'
        meta_title: 'Free Bitcoin QR Code Generator (BIP-21)'
        meta_description: 'Create a free Bitcoin payment QR code with an address, an amount and a label. Standard BIP-21 format, understood by every wallet. PNG and SVG.'
        form_title: 'Your payment'
        intro: 'The scan opens the payer''s wallet with your address, and the amount if you set one. No copy-paste, no transposed character.'
        copy_title: 'Why nobody should ever type an address'
        copy_body: |
            <p>A Bitcoin address is 26 to 62 characters long and a transaction is irreversible: a single wrong character sends the funds somewhere nobody can recover them from. The QR code removes the transcription step entirely, which is why every wallet supports it.</p>
            <p>This generator produces a standard <strong>BIP-21</strong> URI (<code>bitcoin:address?amount=…&amp;label=…</code>). Leave the amount empty for a tip jar or a donation page; set it for an invoice. Before publishing the code, scan it yourself and check the first and last four characters shown by the wallet against your own address.</p>

