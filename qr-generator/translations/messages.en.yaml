faq:
    title: 'Frequently asked questions'
    free:
        q: 'Is this generator really free?'
        a: 'Yes. Every generator on this site is free and unlimited, with no account and no watermark. The site is funded by advertising, which is why the ads only load after you accept them.'
    expire:
        q: 'Do the codes expire?'
        a: 'Never. The codes are static: the content is encoded in the pattern itself, not stored on our servers. Once downloaded, a code keeps working even if this website disappears.'
    commercial:
        q: 'Can I use the codes commercially?'
        a: 'Yes, without restriction: packaging, posters, business cards, products for sale. You own the generated image and owe us nothing — no royalties, no attribution.'
    print:
        q: 'What size should I print a code at?'
        a: 'A rule of thumb: the code should be at least a tenth of the scanning distance. For a scan at 50 cm, print at least 5 cm wide. Always export the SVG for print, keep the quiet margin and test with two or three phones.'
    text:
        q: 'How much text can a QR code hold?'
        a: 'Technically up to about 4,000 characters, but readability drops fast. Stay under 300 characters for a code that scans instantly, and raise the error-correction level if you go beyond that.'
    wifi:
        q: 'Which phones can join a network from a QR code?'
        a: 'iPhones since iOS 11 and Android devices since version 10 handle it natively from the camera app. Older Android phones may need a QR reader app that supports Wi-Fi codes.'
    vcard:
        q: 'Which format is used for the contact card?'
        a: 'vCard 3.0, the format supported by iOS, Android, Outlook, Gmail and every mainstream address book. Nothing to install on the other person’s phone.'
    whatsapp:
        q: 'Do I need a WhatsApp Business account?'
        a: 'No. The code opens a standard wa.me conversation that works with any WhatsApp account, personal or business.'
