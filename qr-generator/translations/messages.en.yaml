tool:
    other_tools: 'Other free generators'
    qrcode:
        name: 'QR code generator'
        object: 'QR code'
        form_title: 'What should the code contain?'
    text:
        name: 'Text QR code generator'
        object: 'text QR code'
        short: 'Encode any plain text, offline.'
        meta_title: 'Free Text QR Code Generator'
        meta_description: 'Encode any plain text in a free QR code: a message, a serial number, a Wi-Fi password or instructions. PNG, SVG and WebP downloads.'
        form_title: 'Your text'
        intro: 'Encode a message, a reference or a set of instructions. The text is stored inside the code itself and stays readable offline.'
        copy_title: 'When plain text beats a link'
        copy_body: |
            <p>A text QR code needs no network: the phone displays the content immediately, even in a basement, a warehouse or a plane. That makes it ideal for machine serial numbers, maintenance instructions, shelf references, event details or a short message on a gift.</p>
            <p>Keep it concise. Below roughly 300 characters the pattern stays comfortable to scan; beyond 1000 it becomes dense and needs a larger print size and a higher error-correction level.</p>
    wifi:
        name: 'Wi-Fi QR code generator'
        object: 'Wi-Fi QR code'
        short: 'Guests connect without typing a password.'
        meta_title: 'Free Wi-Fi QR Code Generator'
        meta_description: 'Create a free Wi-Fi QR code: your guests scan it and connect without typing the password. Works on iOS and Android. PNG and SVG downloads.'
        form_title: 'Your Wi-Fi network'
        intro: 'Print the code, stick it on the wall: guests scan it and join your network without ever seeing the password typed out.'
        copy_title: 'The right way to share a Wi-Fi network'
        copy_body: |
            <p>Since iOS 11 and Android 10, the camera recognises a Wi-Fi QR code and offers to join the network in one tap. Hotels, cafés, coworking spaces, waiting rooms and holiday rentals use it to stop dictating a twenty-character password all day long.</p>
            <p>Type the network name exactly as it is broadcast — SSIDs are case-sensitive. Pick WPA for any modern router (WPA2 and WPA3 use the same setting), and tick "hidden network" only if the SSID is genuinely not broadcast, otherwise some phones will fail to connect.</p>
    vcard:
        name: 'vCard QR code generator'
        object: 'vCard QR code'
        short: 'Share your contact details in one scan.'
        meta_title: 'Free vCard QR Code Generator (contact card)'
        meta_description: 'Create a free vCard QR code with your name, phone, email and company. One scan adds you to any phone contact list. PNG and SVG downloads.'
        form_title: 'Your contact details'
        intro: 'One scan and your details land straight in the other person’s address book — no typing, no typo, no app.'
        copy_title: 'The business card that survives the pocket'
        copy_body: |
            <p>A vCard QR code encodes a standard contact file (vCard 3.0), understood by iOS, Android, Outlook and every modern address book. Print it on your business card, add it to an email signature, a conference badge or a shop window.</p>
            <p>Include only what you want to hand out publicly: a name, a phone number, a professional email and a website are usually enough. The fewer fields you add, the lighter the pattern and the faster the scan.</p>
    whatsapp:
        name: 'WhatsApp QR code generator'
        object: 'WhatsApp QR code'
        short: 'Start a WhatsApp chat instantly.'
        meta_title: 'Free WhatsApp QR Code Generator'
        meta_description: 'Create a free QR code that opens a WhatsApp conversation with a pre-filled message. No WhatsApp Business account required. PNG and SVG downloads.'
        form_title: 'Your WhatsApp conversation'
        intro: 'The scan opens a WhatsApp conversation with your number and, if you want, a ready-to-send message.'
        copy_title: 'A conversation instead of a form'
        copy_body: |
            <p>WhatsApp has become the default customer channel in much of Europe, Latin America and Asia. A QR code that opens a pre-filled conversation ("Hi, I would like a quote for…") converts far better than a contact form nobody wants to fill in on a phone.</p>
            <p>This generator builds a standard wa.me link, so it works with a personal account as well as with WhatsApp Business — no subscription, no verification, nothing to renew.</p>
