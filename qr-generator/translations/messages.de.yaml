home:
    meta_title: 'Kostenloser QR-Code-Generator — ohne Anmeldung, ohne Ablauf | %site%'
    meta_description: 'Erstellen Sie kostenlos einen QR-Code aus einer URL, einem Text, Ihrem WLAN, einer vCard, einer E-Mail oder einer Telefonnummer. Download als PNG, SVG und WebP in hoher Auflösung, ohne Konto und ohne Ablaufdatum.'
    eyebrow: 'Kostenloser QR-Code-Generator'
    h1: 'Erstellen Sie in Sekunden einen kostenlosen QR-Code'
    lead: 'Link, Text — was immer Sie möchten — einfügen und einen hochauflösenden QR-Code als PNG, SVG oder WebP herunterladen. Ohne Konto, ohne Wasserzeichen, ohne Ablaufdatum und mit unbegrenzter kommerzieller Nutzung.'
    tools_title: 'Alle Generatoren, alle kostenlos'
    tools_subtitle: 'Neunzehn spezialisierte Generatoren: Links, WLAN, Kontaktkarten, Termine, Google-Bewertungen, SEPA-Überweisungen, Zwei-Faktor-Authentifizierung, Krypto-Zahlungen und Handels-Barcodes.'
    why_title: 'Warum dieser Generator'
    why:
        free:
            title: 'Kostenlos und unbegrenzt'
            text: 'Kein Kontingent, kein Anmeldeformular, keine Kreditkarte. Werbung finanziert den Dienst, damit die Werkzeuge für alle offen bleiben.'
        privacy:
            title: 'Datenschutz von Anfang an'
            text: 'Codes werden im Moment der Anfrage erzeugt und nie gespeichert. Kein Konto, keine Auswertung Ihrer Inhalte, kein Drittanbieter-Skript vor Ihrer Einwilligung.'
        quality:
            title: 'Druckfertige Qualität'
            text: 'Laden Sie vektorielles SVG für Plakate und Verpackungen oder PNG bis 1024 px. Wählen Sie die Fehlerkorrektur, damit der Code auch beschädigt lesbar bleibt.'
        speed:
            title: 'Funktioniert überall'
            text: 'Statische Codes folgen den Standards, die iOS- und Android-Kameras nativ lesen: keine Weiterleitung, keine Tracking-Domain, nichts, das später kaputtgehen kann.'
    copy_title: 'Alles Wichtige über QR-Codes'
    copy_body: |
        <p>Ein QR-Code ist ein zweidimensionaler Barcode, der Text speichert — meist eine Webadresse. Jedes aktuelle Smartphone liest ihn direkt aus der Kamera-App, was ihn zur schnellsten Brücke zwischen Druck und Website macht: Plakat, Visitenkarte, Speisekarte, Paket oder Produktetikett.</p>
        <p>Die hier erzeugten Codes sind <strong>statisch</strong>: Das Ziel steht im Muster selbst. Nach dem Download hängt nichts mehr von unseren Servern ab, ein heute gedruckter Code funktioniert also auch in zehn Jahren noch — selbst wenn es diese Website nicht mehr gibt. Anderswo verkaufte dynamische Codes leiten jeden Scan über eine fremde Domain, die abgeschaltet, monatlich abgerechnet oder in einen Tracker verwandelt werden kann.</p>
        <p>Für den Druck immer das SVG exportieren: Es bleibt in jeder Größe gestochen scharf. Lassen Sie eine Ruhezone (den weißen Rand) von mindestens vier Modulen, kehren Sie den Kontrast nie um (dunkles Muster auf hellem Grund) und testen Sie die finale Datei vor der Druckfreigabe mit zwei oder drei Telefonen.</p>

