        form_title: 'Was soll im Code stehen?'
    text:
        name: 'Text-QR-Code-Generator'
        object: 'Text-QR-Code'
        short: 'Freien Text codieren, offline lesbar.'
        meta_title: 'Kostenloser Text-QR-Code-Generator'
        meta_description: 'Codieren Sie beliebigen Text in einem kostenlosen QR-Code: eine Nachricht, eine Seriennummer oder eine Anleitung. Download als PNG, SVG und WebP.'
        form_title: 'Ihr Text'
        intro: 'Codieren Sie eine Nachricht, eine Referenz oder eine Anleitung. Der Text steht im Code selbst und bleibt offline lesbar.'
        copy_title: 'Wenn reiner Text besser ist als ein Link'
        copy_body: |
            <p>Ein Text-QR-Code braucht kein Netz: Das Telefon zeigt den Inhalt sofort an, auch im Keller, im Lager oder im Flugzeug. Ideal für Seriennummern, Wartungshinweise, Regalreferenzen oder Veranstaltungsdaten.</p>
            <p>Fassen Sie sich kurz. Unter etwa 300 Zeichen bleibt das Muster angenehm scanbar; über 1000 Zeichen wird es dicht und verlangt größeren Druck und höhere Fehlerkorrektur.</p>
    wifi:
        name: 'WLAN-QR-Code-Generator'
        object: 'WLAN-QR-Code'
        short: 'Gäste verbinden sich ohne Passworteingabe.'
        meta_title: 'Kostenloser WLAN-QR-Code-Generator'
        meta_description: 'Erstellen Sie einen kostenlosen WLAN-QR-Code: Gäste scannen ihn und verbinden sich ohne Passworteingabe. Für iOS und Android. Download als PNG und SVG.'
        form_title: 'Ihr WLAN'
        intro: 'Code drucken, an die Wand hängen: Gäste scannen und sind im Netz, ohne das Passwort je zu sehen.'
        copy_title: 'Ein WLAN richtig teilen'
        copy_body: |
            <p>Seit iOS 11 und Android 10 erkennt die Kamera einen WLAN-QR-Code und bietet den Beitritt mit einem Tippen an. Hotels, Cafés, Coworking-Spaces, Wartezimmer und Ferienwohnungen sparen sich damit das tägliche Diktieren zwanzigstelliger Passwörter.</p>
            <p>Geben Sie den Netzwerknamen exakt so ein, wie er gesendet wird — SSIDs unterscheiden Groß- und Kleinschreibung. Wählen Sie WPA für jeden modernen Router und setzen Sie „verstecktes Netzwerk" nur, wenn die SSID wirklich nicht gesendet wird.</p>
    vcard:
        name: 'Visitenkarten-QR-Code-Generator'
        object: 'vCard-QR-Code'
        short: 'Kontaktdaten mit einem Scan teilen.'
        meta_title: 'Kostenloser vCard-QR-Code-Generator (Visitenkarte)'
        meta_description: 'Erstellen Sie einen kostenlosen vCard-QR-Code mit Name, Telefon, E-Mail und Firma. Ein Scan genügt für den Eintrag ins Adressbuch. PNG und SVG.'
        form_title: 'Ihre Kontaktdaten'
        intro: 'Ein Scan, und Ihre Daten landen direkt im Adressbuch Ihres Gegenübers — ohne Tippen, ohne Fehler, ohne App.'
        copy_title: 'Die Visitenkarte, die die Hosentasche überlebt'
        copy_body: |
            <p>Ein vCard-QR-Code enthält eine standardisierte Kontaktdatei (vCard 3.0), die iOS, Android, Outlook und jedes moderne Adressbuch versteht. Drucken Sie ihn auf die Visitenkarte, in die E-Mail-Signatur, auf ein Messebadge oder ins Schaufenster.</p>
            <p>Nehmen Sie nur auf, was öffentlich sein soll: Name, Telefonnummer, geschäftliche E-Mail und Website genügen meist. Je weniger Felder, desto leichter das Muster und desto schneller der Scan.</p>
    whatsapp:
        name: 'WhatsApp-QR-Code-Generator'
        object: 'WhatsApp-QR-Code'
        short: 'Öffnet sofort einen WhatsApp-Chat.'
        meta_title: 'Kostenloser WhatsApp-QR-Code-Generator'
        meta_description: 'Erstellen Sie einen kostenlosen QR-Code, der einen WhatsApp-Chat mit vorbereiteter Nachricht öffnet. Ohne WhatsApp-Business-Konto. PNG und SVG.'
        form_title: 'Ihr WhatsApp-Chat'
        intro: 'Der Scan öffnet einen WhatsApp-Chat mit Ihrer Nummer und auf Wunsch einer fertigen Nachricht.'
        copy_title: 'Ein Gespräch statt eines Formulars'
        copy_body: |
            <p>WhatsApp ist in weiten Teilen Europas, Lateinamerikas und Asiens der Standardkanal zum Kunden. Ein QR-Code, der einen vorbereiteten Chat öffnet („Hallo, ich hätte gern ein Angebot für…"), konvertiert deutlich besser als ein Kontaktformular, das niemand am Handy ausfüllen möchte.</p>
            <p>Dieser Generator erzeugt einen normalen wa.me-Link: Er funktioniert mit einem privaten Konto ebenso wie mit WhatsApp Business — kein Abo, keine Verifizierung.</p>
