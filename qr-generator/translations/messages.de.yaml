        text: 'PNG für Bildschirme, SVG für den Druck, WebP für die kleinste Datei. Der Code gehört Ihnen — kostenlos, ohne Wasserzeichen und ohne Ablaufdatum.'

faq:
    title: 'Häufige Fragen'
    free:
        q: 'Ist dieser Generator wirklich kostenlos?'
        a: 'Ja. Alle Generatoren dieser Website sind kostenlos und unbegrenzt, ohne Konto und ohne Wasserzeichen. Finanziert wird das Angebot durch Werbung — deshalb laden Anzeigen erst nach Ihrer Zustimmung.'
    expire:
        q: 'Laufen die Codes ab?'
        a: 'Nie. Die Codes sind statisch: Der Inhalt steht im Muster und liegt nicht auf unseren Servern. Einmal heruntergeladen, funktioniert ein Code weiter, selbst wenn diese Website verschwindet.'
    commercial:
        q: 'Darf ich die Codes kommerziell nutzen?'
        a: 'Ja, ohne Einschränkung: Verpackungen, Plakate, Visitenkarten, verkaufte Produkte. Das erzeugte Bild gehört Ihnen — ohne Lizenzgebühr und ohne Namensnennung.'
    print:
        q: 'Wie groß sollte ich einen Code drucken?'
        a: 'Faustregel: Der Code sollte mindestens ein Zehntel der Scan-Entfernung messen. Für einen Scan aus 50 cm also mindestens 5 cm breit. Für den Druck immer das SVG exportieren, den Rand lassen und mit zwei oder drei Telefonen testen.'
    url:
        q: 'Kann ich das Ziel meines QR-Codes später ändern?'
        a: 'Bei einem statischen Code nicht — die URL steht im Muster. Wenn Sie mit Änderungen rechnen, codieren Sie einen Link, den Sie kontrollieren (eigene Domain, weiterleitende Seite), und ändern Sie die Weiterleitung statt neu zu drucken.'
    text:
        q: 'Wie viel Text passt in einen QR-Code?'
        a: 'Technisch bis etwa 4000 Zeichen, die Lesbarkeit sinkt aber schnell. Bleiben Sie unter 300 Zeichen für sofortiges Scannen und erhöhen Sie darüber hinaus die Fehlerkorrektur.'
    wifi:
        q: 'Welche Telefone verbinden sich per QR-Code mit einem Netzwerk?'
        a: 'iPhones ab iOS 11 und Android-Geräte ab Version 10 beherrschen das direkt in der Kamera-App. Ältere Android-Geräte brauchen unter Umständen eine QR-App mit WLAN-Unterstützung.'
    vcard:
        q: 'Welches Format hat die Kontaktkarte?'
        a: 'vCard 3.0 — unterstützt von iOS, Android, Outlook, Gmail und allen gängigen Adressbüchern. Auf dem Telefon Ihres Gegenübers muss nichts installiert werden.'
    email:
        q: 'Wird die E-Mail beim Scannen automatisch gesendet?'
        a: 'Nein, und das ist Absicht: Der Scan öffnet das Mailprogramm mit vorbereitetem Inhalt, gesendet wird per Tippen. Vorher lässt sich alles noch ändern.'
    sms:
        q: 'Kostet die SMS die scannende Person etwas?'
        a: 'Die Nachricht geht von ihrem eigenen Telefon aus, es gilt also ihr üblicher Tarif. Diese Website berechnet nichts, und der Code funktioniert auch ohne Datenverbindung.'
    phone:
        q: 'Startet der Anruf von selbst?'
        a: 'Nein. Der Scan öffnet die Wähltastatur mit der Nummer, angerufen wird per Tippen. Das ist eine Sicherheitsvorgabe von iOS und Android.'
    whatsapp:
        q: 'Brauche ich ein WhatsApp-Business-Konto?'
        a: 'Nein. Der Code öffnet einen normalen wa.me-Chat, der mit jedem WhatsApp-Konto funktioniert, privat wie geschäftlich.'
    geo:
        q: 'Welche App öffnet sich beim Scannen?'
        a: 'Die Standard-Karten-App des Telefons — Apple Karten unter iOS, Google Maps auf den meisten Android-Geräten. Die Koordinaten werden im Standardformat geo: übergeben.'
    barcode:
        q: 'Darf ich mir eine EAN-13-Nummer ausdenken?'
        a: 'Für den Handel nicht. Eine verkaufte EAN-13 muss aus einem GS1-Präfix Ihres Unternehmens stammen. Für interne Zwecke — Lager, Inventar, Logistik — nummerieren Sie frei, und Code 128 passt dort meist besser.'
    event:
        q: 'Welche Kalender akzeptieren den Code?'
        a: 'Der Scan öffnet den nativen Kalender unter iOS und Android, der anschließend wie gewohnt mit Google Kalender, iCloud oder Outlook synchronisiert. Codiert wird das Standardformat VEVENT.'
    review:
        q: 'Darf ich den Code nur zufriedenen Gästen zeigen?'
        a: 'Nein. Vorauszuwählen, wer zu einer Bewertung eingeladen wird, verstößt gegen Googles Richtlinien und kann Ihr Profil sperren. Zeigen Sie allen denselben Code — und fragen Sie, wenn die Leistung gut gelaufen ist.'
    bitcoin:
        q: 'Ist der Betrag im Code festgeschrieben?'
        a: 'Er ist ein Vorschlag: Die Wallet trägt ihn ein, die zahlende Person kann ihn vor dem Signieren noch ändern. Für eine Spende lassen Sie das Feld leer, für eine Rechnung füllen Sie es aus.'
    sepa:
        q: 'Welche Banken lesen einen GiroCode?'
        a: 'Nahezu alle deutschen und österreichischen Banking-Apps können es nativ, ebenso viele in den Niederlanden, Belgien und Finnland. Wo es nicht unterstützt wird, zeigt der Scan einfach den Text — ihn hinzuzufügen kostet also nichts.'
    totp:
        q: 'Ist es sicher, hier einen 2FA-Code zu erzeugen?'
        a: 'Das Geheimnis dient nur dem Bildaufbau und wird danach verworfen — gespeichert wird es nie. Dennoch: Ein TOTP-Geheimnis ist ein Zugangsdatum. Veröffentlichen Sie nie einen Code aus einem echten Geheimnis, und erneuern Sie es bei einem Leck.'
    crypto:
        q: 'Welche Chains werden unterstützt?'
        a: 'Ethereum (EIP-681), Litecoin, Dogecoin, Bitcoin Cash, Dash (BIP-21), Monero und Solana Pay. Bitcoin hat einen eigenen Generator. Die Adresse wird gegen die gewählte Chain geprüft.'
    telegram:
        q: 'Funktioniert das auch für einen Kanal oder einen Bot?'
        a: 'Ja. Jeder öffentliche Benutzername funktioniert — persönliches Konto, Kanal, Gruppe oder Bot. Eine Nummer im internationalen Format geht ebenfalls.'
    signal:
        q: 'Gibt der Code meine Telefonnummer preis?'
        a: 'Ja: Signal identifiziert Konten über die Telefonnummer, sie steht also im Link. Veröffentlichen Sie nur eine Nummer, die öffentlich sein darf.'
    directions:
        q: 'Funktioniert das ohne installiertes Google Maps?'
        a: 'Ja. Auf einem Telefon ohne App öffnet der Link die Webversion von Google Maps, die dieselbe Route anbietet.'

