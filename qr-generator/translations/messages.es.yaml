home:
    meta_title: 'Generador de códigos QR gratis — sin registro ni caducidad | %site%'
    meta_description: 'Pega un enlace y obtén un código QR gratuito al instante. Descarga PNG, SVG y WebP en alta resolución, sin cuenta, sin marca de agua y sin caducidad.'
    eyebrow: 'Generador de códigos QR gratis'
    h1: 'Crea un código QR gratis en segundos'
    lead: 'Pega un enlace, un texto —lo que quieras— y obtén un código QR en alta resolución para descargar en PNG, SVG o WebP. Sin cuenta, sin marca de agua, sin caducidad y con uso comercial ilimitado.'
    tools_title: 'Unos formatos listos para usar'
    tools_subtitle: 'El generador de arriba codifica cualquier cosa. Estas cuatro páginas rellenan el formato por ti.'
    why_title: 'Por qué usar este generador'
    why:
        free:
            title: 'Gratis e ilimitado'
            text: 'Sin cuotas, sin formulario de registro y sin tarjeta bancaria. La publicidad financia el servicio para que las herramientas sigan abiertas a todos.'
        privacy:
            title: 'Privacidad por diseño'
            text: 'Los códigos se generan al vuelo y nunca se almacenan. Sin cuenta, sin seguimiento de lo que codificas y sin scripts de terceros antes de tu consentimiento.'
        quality:
            title: 'Calidad lista para imprimir'
            text: 'Descarga SVG vectorial para carteles y envases, o PNG de hasta 1024 px. Elige el nivel de corrección de errores para que el código siga leyéndose aunque esté dañado.'
        speed:
            title: 'Funciona en todas partes'
            text: 'Los códigos estáticos siguen los estándares que leen de forma nativa las cámaras de iOS y Android: sin redirecciones, sin dominios de seguimiento y sin nada que pueda romperse después.'
    copy_title: 'Todo lo que necesitas saber sobre los códigos QR'
    copy_body: |
        <p>Un código QR es un código de barras bidimensional que almacena texto, casi siempre una dirección web. Cualquier smartphone reciente lo lee directamente desde la cámara, lo que lo convierte en el puente más rápido entre un soporte impreso y una página web: un cartel, una tarjeta de visita, una carta de restaurante, un paquete o una etiqueta de producto.</p>
        <p>Los códigos que se generan aquí son <strong>estáticos</strong>: el destino está escrito en el propio patrón. Una vez descargada la imagen, nada depende de nuestros servidores, así que un código impreso hoy seguirá funcionando dentro de diez años, incluso si este sitio desaparece. Los códigos dinámicos que se venden en otros sitios hacen pasar cada escaneo por un dominio de terceros que puede apagarse, facturarse mensualmente o convertirse en un rastreador.</p>
        <p>Para imprimir, exporta siempre el SVG: se mantiene nítido a cualquier tamaño. Conserva una zona de silencio (el margen blanco) de al menos cuatro módulos alrededor del código, no inviertas nunca el contraste (patrón oscuro sobre fondo claro) y prueba el archivo final con dos o tres teléfonos antes de enviarlo a imprenta.</p>

