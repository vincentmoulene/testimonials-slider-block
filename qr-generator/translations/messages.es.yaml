    h1: 'Todos nuestros generadores gratuitos'
    lead: 'Elige el tipo de código que necesitas. Todos los generadores son gratuitos, ilimitados y funcionan sin cuenta.'
    grid_title: 'Generadores'

tool:
    other_tools: 'Otros generadores gratuitos'
    qrcode:
        name: 'Generador de códigos QR'
        object: 'código QR'
        form_title: '¿Qué debe contener el código?'
    url:
        name: 'Generador de código QR con URL'
        object: 'código QR de URL'
        short: 'Convierte cualquier enlace en un código escaneable.'
        meta_title: 'Generador gratuito de código QR con URL'
        meta_description: 'Convierte un enlace en un código QR gratuito. Descárgalo en PNG, SVG o WebP en alta resolución, sin cuenta, sin marca de agua y sin caducidad.'
        form_title: 'Tu enlace'
        intro: 'Pega un enlace y descarga un código QR que lo abre al instante en cualquier teléfono. Gratis, ilimitado y permanente.'
        copy_title: 'Conectar un soporte impreso con una página web'
        copy_body: |
            <p>El código QR de URL es el uso más habitual: abre una página en cuanto se escanea, sin teclear y sin errores. Úsalo en un envase para enlazar las instrucciones, en un cartel para abrir un formulario de reserva, en un folleto para llevar a tu tienda o en una factura para abrir la página de pago.</p>
            <p>Mantén la URL corta: menos caracteres significan menos módulos, un patrón más grande y un escaneo más fácil a distancia. Prueba siempre el resultado impreso al tamaño y a la distancia reales de uso.</p>
    text:
        name: 'Generador de código QR de texto'
        object: 'código QR de texto'
        short: 'Codifica texto libre, legible sin conexión.'
        meta_title: 'Generador gratuito de código QR de texto'
        meta_description: 'Codifica cualquier texto en un código QR gratuito: un mensaje, un número de serie o unas instrucciones. Descarga en PNG, SVG y WebP.'
        form_title: 'Tu texto'
        intro: 'Codifica un mensaje, una referencia o unas instrucciones. El texto se guarda en el propio código y se lee sin conexión.'
        copy_title: 'Cuándo el texto es mejor que un enlace'
        copy_body: |
            <p>Un código QR de texto no necesita red: el teléfono muestra el contenido de inmediato, incluso en un sótano, un almacén o un avión. Es ideal para números de serie, instrucciones de mantenimiento, referencias de estantería o los datos de un evento.</p>
            <p>Sé breve. Por debajo de unos 300 caracteres el patrón resulta cómodo de escanear; por encima de 1000 se vuelve denso y exige mayor tamaño de impresión y más corrección de errores.</p>
    wifi:
        name: 'Generador de código QR de Wi-Fi'
        object: 'código QR de Wi-Fi'
        short: 'Tus invitados se conectan sin escribir la contraseña.'
        meta_title: 'Generador gratuito de código QR para Wi-Fi'
        meta_description: 'Crea un código QR de Wi-Fi gratis: tus invitados lo escanean y se conectan sin escribir la contraseña. Compatible con iOS y Android. PNG y SVG.'
        form_title: 'Tu red Wi-Fi'
        intro: 'Imprime el código y cuélgalo en la pared: los invitados lo escanean y se conectan sin ver nunca la contraseña.'
        copy_title: 'La forma correcta de compartir una red Wi-Fi'
        copy_body: |
            <p>Desde iOS 11 y Android 10, la cámara reconoce un código QR de Wi-Fi y propone unirse a la red con un toque. Hoteles, cafeterías, espacios de coworking, salas de espera y apartamentos turísticos lo usan para dejar de dictar contraseñas de veinte caracteres.</p>
            <p>Escribe el nombre de la red exactamente como se emite: los SSID distinguen mayúsculas y minúsculas. Elige WPA para cualquier router moderno y marca «red oculta» solo si el SSID realmente no se difunde.</p>
    vcard:
        name: 'Generador de código QR vCard'
        object: 'código QR vCard'
        short: 'Comparte tus datos de contacto en un escaneo.'
        meta_title: 'Generador gratuito de código QR vCard (tarjeta de contacto)'
        meta_description: 'Crea un código QR vCard gratis con tu nombre, teléfono, correo y empresa. Un escaneo y estás en su agenda. Descarga en PNG y SVG.'
        form_title: 'Tus datos de contacto'
        intro: 'Un escaneo y tus datos llegan directamente a la agenda de la otra persona, sin teclear y sin errores.'
        copy_title: 'La tarjeta de visita que sobrevive al bolsillo'
        copy_body: |
            <p>Un código QR vCard codifica un archivo de contacto estándar (vCard 3.0) que entienden iOS, Android, Outlook y todas las agendas modernas. Imprímelo en tu tarjeta, en la firma del correo, en una acreditación de feria o en un escaparate.</p>
            <p>Incluye solo lo que quieras hacer público: nombre, teléfono, correo profesional y sitio web suelen bastar. Cuantos menos campos, más ligero el patrón y más rápido el escaneo.</p>
    email:
        name: 'Generador de código QR de correo'
        object: 'código QR de correo'
        short: 'Abre un correo ya rellenado en un escaneo.'
        meta_title: 'Generador gratuito de código QR de correo electrónico'
        meta_description: 'Crea un código QR gratuito que abre un correo con asunto y mensaje ya escritos. Ideal para soporte, presupuestos y opiniones. PNG y SVG.'
        form_title: 'Tu correo'
        intro: 'El escaneo abre la aplicación de correo con tu dirección, el asunto y el mensaje ya rellenados. Solo queda enviar.'
        copy_title: 'Quitar fricción a cada solicitud'
        copy_body: |
            <p>Rellenar el asunto convierte una bandeja de entrada confusa en una ordenada: «Solicitud de presupuesto — campaña de carteles» te dice de dónde viene el mensaje antes de abrirlo. Imprime el código en un folleto, un albarán, un equipo o un estand.</p>
            <p>Mantén el cuerpo prerrellenado corto y neutro: es un punto de partida, no un guion. El visitante siempre puede editarlo antes de enviarlo.</p>
    sms:
        name: 'Generador de código QR de SMS'
        object: 'código QR de SMS'
        short: 'Prerellena un mensaje de texto.'
        meta_title: 'Generador gratuito de código QR de SMS'
        meta_description: 'Crea un código QR gratuito que abre un SMS ya escrito hacia tu número. Perfecto para votaciones, pedidos y soporte. Descarga en PNG y SVG.'
        form_title: 'Tu SMS'
        intro: 'El escaneo abre la mensajería con tu número y tu mensaje listos para enviar.'
        copy_title: 'Un canal universal, sin aplicaciones'
        copy_body: |
            <p>El SMS funciona en todos los teléfonos, sin cuenta, sin aplicación y sin conexión de datos. Un código QR de SMS es una opción fiable para una votación, un pedido en mesa, una solicitud de llamada o una consulta de stock.</p>
            <p>Escribe siempre el número en formato internacional (+ prefijo del país): el formato nacional solo funciona para teléfonos registrados en el mismo país.</p>
    phone:
        name: 'Generador de código QR de teléfono'
        object: 'código QR de teléfono'
        short: 'Un escaneo inicia la llamada.'
        meta_title: 'Generador gratuito de código QR con número de teléfono'
        meta_description: 'Crea un código QR gratuito que marca tu número al escanearlo. Ideal para escaparates, vehículos y anuncios. Descarga en PNG y SVG.'
        form_title: 'Tu número de teléfono'
        intro: 'El escaneo abre el marcador con tu número ya introducido, sin teclear y sin equivocarse de dígito.'
        copy_title: 'Cuándo un código de teléfono gana a un enlace'
        copy_body: |
            <p>En una furgoneta, un escaparate, un cartel de «se vende» o una máquina averiada, llamar es más rápido que navegar. El código QR de teléfono elimina el paso de copiar el número, justo donde se pierden los clientes.</p>
            <p>Usa el formato internacional (+ prefijo del país) para que funcione también con visitantes extranjeros, y coloca el código a la altura de los ojos.</p>
    whatsapp:
        name: 'Generador de código QR de WhatsApp'
        object: 'código QR de WhatsApp'
        short: 'Abre una conversación de WhatsApp al instante.'
        meta_title: 'Generador gratuito de código QR de WhatsApp'
        meta_description: 'Crea un código QR gratuito que abre una conversación de WhatsApp con un mensaje ya escrito. Sin cuenta de WhatsApp Business. PNG y SVG.'
        form_title: 'Tu conversación de WhatsApp'
        intro: 'El escaneo abre una conversación de WhatsApp con tu número y, si quieres, un mensaje listo para enviar.'
        copy_title: 'Una conversación en lugar de un formulario'
        copy_body: |
            <p>WhatsApp se ha convertido en el canal de atención por defecto en buena parte de Europa y de América Latina. Un código QR que abre una conversación ya iniciada («Hola, quiero un presupuesto para…») convierte mucho mejor que un formulario que nadie quiere rellenar en el móvil.</p>
            <p>Este generador crea un enlace wa.me estándar: funciona igual con una cuenta personal que con WhatsApp Business, sin suscripción ni verificación.</p>
    geo:
        name: 'Generador de código QR de ubicación'
        object: 'código QR de ubicación'
        short: 'Abre un mapa en las coordenadas exactas.'
        meta_title: 'Generador gratuito de código QR de ubicación (GPS)'
        meta_description: 'Crea un código QR gratuito que abre un mapa en tus coordenadas GPS. Perfecto para locales, puntos de encuentro y entregas. PNG y SVG.'
        form_title: 'Tus coordenadas'
        intro: 'El escaneo abre la aplicación de mapas del teléfono directamente en las coordenadas indicadas.'
        copy_title: 'Guiar hacia un punto, no hacia una dirección'
        copy_body: |
            <p>Algunos lugares no tienen dirección postal utilizable: la entrada de un festival, un portón de reparto, el inicio de un sendero, una parcela o un punto de encuentro en un aparcamiento. Las coordenadas GPS los describen con exactitud.</p>
            <p>Copia la latitud y la longitud desde cualquier servicio de mapas (clic derecho sobre el punto) y pégalas aquí en grados decimales, por ejemplo 48.8584 y 2.2945.</p>
    barcode:
        name: 'Generador de códigos de barras'
        object: 'código de barras'
        short: 'EAN-13, UPC-A, Code 128 y más.'
        meta_title: 'Generador gratuito de códigos de barras (EAN-13, UPC, Code 128)'
        meta_description: 'Crea gratis códigos de barras EAN-13, EAN-8, UPC-A, Code 128, Code 39 e ITF-14. Exportación SVG vectorial para imprenta. Sin cuenta.'
        form_title: 'Tu código de barras'
        intro: 'Genera un código de barras comercial o logístico y expórtalo en vectorial, listo para envases y etiquetas.'
        copy_title: 'Elegir la simbología correcta'
        copy_body: |
            <p>El EAN-13 es el estándar de los productos de tienda en Europa (12 dígitos más un dígito de control), el UPC-A su equivalente norteamericano y el EAN-8 la versión compacta para envases pequeños. El Code 128 codifica letras y números y mueve la mayor parte de la logística interna; el Code 39 sigue siendo común en la industria; el ITF-14 identifica las cajas de expedición.</p>
            <p>Exporta el SVG para imprimir: un código de barras se lee por el ancho de sus barras, así que reescalar una imagen de mapa de bits puede volverlo ilegible. Barras negras sobre fondo blanco, zonas de silencio a ambos lados y nunca por debajo del 80 % del tamaño nominal.</p>
    event:
        name: 'Generador de código QR de evento'
        object: 'código QR de evento'
        short: 'Añade un evento a cualquier calendario en un escaneo.'
        meta_title: 'Generador gratuito de código QR de evento (calendario)'
        meta_description: 'Crea un código QR gratuito que añade tu evento al calendario de quien lo escanea: fecha, hora y lugar incluidos. Descarga en PNG y SVG.'
        form_title: 'Tu evento'
        intro: 'Un escaneo y tu evento aterriza en el calendario de la persona que tienes delante: fecha, hora y dirección correctas.'
        copy_title: 'Meter una fecha en la agenda de la gente'
        copy_body: |
            <p>Una invitación solo funciona cuando está en el calendario. Un código QR de evento codifica una entrada de calendario estándar (VEVENT): al escanearlo se abre la aplicación de calendario del teléfono con todo relleno —título, inicio, fin y lugar—. Imprímelo en una invitación, un cartel de concierto, un programa de formación o una acreditación.</p>
            <p>Las horas se codifican en hora local, tal y como las escribes: el lector muestra el evento tal cual, esté donde esté la persona. Para un evento recurrente, genera un código por fecha en lugar de codificar una regla de repetición: se escanea de forma mucho más fiable.</p>
    review:
        name: 'Generador de código QR de reseñas de Google'
        object: 'código QR de reseñas'
        short: 'Lleva a tus clientes directos al formulario de reseña.'
        meta_title: 'Generador gratuito de código QR de reseñas de Google'
        meta_description: 'Crea un código QR gratuito que abre directamente tu formulario de reseñas de Google. Perfecto para tickets, mesas y mostradores. PNG y SVG.'
        form_title: 'Tu enlace de reseñas'
        intro: 'Convierte a un cliente satisfecho en una reseña mientras sigue delante de ti: el escaneo abre directamente el formulario de valoración.'
        copy_title: 'Dónde encontrar tu enlace de reseñas'
        copy_body: |
            <p>Abre tu Perfil de Empresa de Google, pulsa <em>Pedir reseñas</em> y copia el enlace corto que te da Google (del tipo <code>g.page/r/…/review</code>). Pégalo aquí y obtendrás un código que abre directamente el formulario de estrellas: sin búsquedas, sin menús y sin riesgo de valorar otro negocio.</p>
            <p>La ubicación importa más que el diseño: en el ticket, en el caballete de mesa, en el mostrador junto al datáfono o en la factura que envías por correo. Pide la reseña en el momento en que el cliente está contento, justo después del servicio, no tres días más tarde. Y nunca filtres quién puede escanear: seleccionar según la nota esperada incumple las políticas de Google y provoca suspensiones.</p>
    bitcoin:
        name: 'Generador de código QR de Bitcoin'
        object: 'código QR de Bitcoin'
        short: 'Cobra sin que nadie teclee una dirección.'
        meta_title: 'Generador gratuito de código QR de Bitcoin (BIP-21)'
        meta_description: 'Crea un código QR de pago Bitcoin gratuito con dirección, importe y etiqueta. Formato estándar BIP-21, compatible con todos los monederos. PNG y SVG.'
        form_title: 'Tu pago'
        intro: 'El escaneo abre el monedero del pagador con tu dirección y, si lo indicas, el importe. Sin copiar y pegar, sin caracteres cambiados.'
        copy_title: 'Por qué nadie debería teclear una dirección'
        copy_body: |
            <p>Una dirección de Bitcoin tiene entre 26 y 62 caracteres y una transacción es irreversible: un solo carácter erróneo envía los fondos a un sitio del que nadie los recupera. El código QR elimina por completo el paso de la transcripción, y por eso todos los monederos lo admiten.</p>
            <p>Este generador produce una URI <strong>BIP-21</strong> estándar (<code>bitcoin:direccion?amount=…&amp;label=…</code>). Deja el importe vacío para un bote o una página de donaciones; rellénalo para una factura. Antes de publicar el código, escanéalo tú mismo y compara los cuatro primeros y últimos caracteres que muestra el monedero.</p>
    sepa:
        name: 'Generador de código QR de transferencia SEPA'
        object: 'código QR de transferencia SEPA'
        short: 'Cobra por transferencia sin que nadie teclee nada.'
        meta_title: 'Generador gratuito de código QR de transferencia SEPA (EPC / GiroCode)'
        meta_description: 'Crea un código QR EPC gratuito (GiroCode): quien paga lo escanea y su aplicación bancaria se abre con tu IBAN, tu nombre y el importe rellenados. PNG y SVG.'
        form_title: 'Tu transferencia'
        intro: 'Quien paga escanea y su aplicación bancaria se abre con tu IBAN, tu nombre y el importe ya rellenados. Solo tiene que confirmar.'
        copy_title: 'El estándar europeo que casi nadie conoce'
        copy_body: |
            <p>El código QR EPC —también llamado <strong>GiroCode</strong>— es un estándar del Consejo Europeo de Pagos (EPC069-12). Escaneado desde una aplicación bancaria, prepara una transferencia SEPA: beneficiario, IBAN, importe y concepto. Sin tarjeta, sin pasarela de pago y sin comisión: el dinero va directamente de una cuenta a otra.</p>
            <p>Lo leen de forma nativa la mayoría de las aplicaciones bancarias de Alemania, Austria, Países Bajos, Bélgica y Finlandia, y cada vez más en el resto de Europa. Donde todavía no se admite, el escaneo simplemente muestra el texto: añadirlo no cuesta nada. Imprímelo en facturas, formularios de donación, cuotas de socio y carteles de eventos.</p>
            <p>Tu IBAN se comprueba aquí con el algoritmo ISO 7064, el mismo que usan los bancos, así que una errata se detecta antes de imprimir nada. No se envía a ninguna parte: el código se construye al vuelo y nunca se guarda.</p>
    totp:
        name: 'Generador de código QR 2FA'
        object: 'código QR 2FA'
        short: 'Da de alta una app de autenticación en un escaneo.'
        meta_title: 'Generador gratuito de código QR 2FA / TOTP (otpauth)'
        meta_description: 'Crea un código QR otpauth:// gratuito para dar de alta Google Authenticator, Authy, 1Password o Bitwarden. TOTP estándar, SHA-1, 6 dígitos, 30 segundos.'
        form_title: 'Tu secreto TOTP'
        intro: 'Convierte un secreto TOTP en el código QR que esperan las aplicaciones de autenticación, el que se muestra al final de un alta de doble factor.'
        copy_title: 'Qué contiene un código QR 2FA'
        copy_body: |
            <p>Todas las aplicaciones de autenticación leen la misma URI: <code>otpauth://totp/Servicio:cuenta?secret=…&amp;issuer=…</code>. El secreto es una cadena Base32 compartida una sola vez entre tu servidor y la aplicación; a partir de ahí ambos calculan los mismos seis dígitos cada treinta segundos, sin conexión. Este generador produce esa URI con los valores predeterminados de todas las apps: SHA-1, 6 dígitos, periodo de 30 segundos.</p>
            <p>Úsalo para construir una pantalla de alta, migrar un secreto a un móvil nuevo o probar una integración sin programar el QR. El nombre del servicio es lo que aparece encima de los dígitos en la aplicación: pon el que tus usuarios reconozcan.</p>
            <p><strong>Una advertencia.</strong> Un secreto TOTP es una credencial: quien escanee el código podrá generar tus códigos indefinidamente. No lo envíes por correo ni por mensajería, no lo dejes en una captura de pantalla y no publiques nunca un código creado a partir de un secreto real. En caso de duda, cambia el secreto: no cuesta nada.</p>
    crypto:
        name: 'Generador de código QR cripto'
        object: 'código QR cripto'
        short: 'Ethereum, Litecoin, Dogecoin, Monero y más.'
        meta_title: 'Generador gratuito de código QR de pago cripto (ETH, LTC, DOGE…)'
        meta_description: 'Crea un código QR de pago gratuito para Ethereum, Litecoin, Dogecoin, Bitcoin Cash, Monero, Dash o Solana. URI estándar, compatible con todos los monederos.'
        form_title: 'Tu pago'
        intro: 'Elige una moneda y pega tu dirección: el escaneo abre el monedero de quien paga con todo rellenado. Sin copiar y pegar, sin caracteres cambiados.'
        copy_title: 'Un código, el estándar correcto para cada cadena'
        copy_body: |
            <p>Cada cadena tiene su propia convención de URI, y un monedero solo lee la correcta. Este generador emite el formato adecuado para cada una: <strong>EIP-681</strong> para Ethereum (<code>ethereum:0x…@1?value=…</code>, con el importe en wei), <strong>BIP-21</strong> para Litecoin, Dogecoin, Bitcoin Cash y Dash, el parámetro <code>tx_amount</code> propio de Monero y <strong>Solana Pay</strong> para SOL.</p>
            <p>La dirección se valida contra el formato de la cadena elegida, así que pegar una dirección de Ethereum en Litecoin se detecta de inmediato: la causa más común de fondos perdidos. Deja el importe vacío para un bote y rellénalo para una factura.</p>
            <p>Para Bitcoin, usa el <em>generador dedicado</em>: mismo principio, con las particularidades de esa cadena. Y antes de publicar cualquier código de pago, escanéalo tú mismo y compara los cuatro primeros y últimos caracteres que muestra el monedero con tu dirección.</p>
    telegram:
        name: 'Generador de código QR de Telegram'
        object: 'código QR de Telegram'
        short: 'Abre una conversación de Telegram en un escaneo.'
        meta_title: 'Generador gratuito de código QR de Telegram'
        meta_description: 'Crea un código QR gratuito que abre tu perfil, canal o grupo de Telegram. Funciona con un nombre de usuario o un número. Descarga en PNG y SVG.'
        form_title: 'Tu cuenta de Telegram'
        intro: 'El escaneo abre directamente tu perfil, canal o grupo de Telegram: sin búsquedas y sin riesgo de acabar en una cuenta suplantada.'
        copy_title: 'Por qué un código gana a «búscame en Telegram»'
        copy_body: |
            <p>Los nombres de usuario de Telegram son fáciles de imitar: una letra cambiada y tu audiencia acaba en otra cuenta. Un código QR elimina el paso de la búsqueda y con él el riesgo de suplantación. Funciona con una cuenta personal, un canal público, un grupo o un bot.</p>
            <p>Escribe tu nombre de usuario con o sin @, o un número en formato internacional: <code>t.me/+34600000000</code> abre la misma conversación. Coloca el código en una tarjeta, un escaparate, un overlay de directo o la última diapositiva de una charla.</p>
    signal:
        name: 'Generador de código QR de Signal'
        object: 'código QR de Signal'
        short: 'Comparte tu contacto de Signal en privado.'
        meta_title: 'Generador gratuito de código QR de Signal'
        meta_description: 'Crea un código QR gratuito que abre una conversación de Signal con tu número. Ideal para periodistas, abogados y cualquiera que necesite un canal privado.'
        form_title: 'Tu número de Signal'
        intro: 'El escaneo abre una conversación de Signal con tu número: un canal cifrado, entregado sin dictar nada.'
        copy_title: 'Entregar un canal seguro, de forma segura'
        copy_body: |
            <p>Signal es la referencia en mensajería cifrada de extremo a extremo, y es lo que usan periodistas, abogados, médicos y ONG para recibir información sensible. Pero un canal solo sirve si se puede alcanzar: un número dictado en voz alta, mal copiado o leído en una foto borrosa es un canal que nadie usa.</p>
            <p>El código contiene un enlace <code>signal.me</code> estándar. Imprímelo al pie de un artículo, en una página de contacto, en un cartel de sala de espera o en una acreditación de prensa. Ten en cuenta que el número queda visible para quien escanea: Signal identifica las cuentas por número, así que publica uno que aceptes hacer público.</p>
    directions:
        name: 'Generador de código QR de cómo llegar'
        object: 'código QR de cómo llegar'
        short: 'Lanza la navegación hasta tu dirección.'
        meta_title: 'Generador gratuito de código QR de cómo llegar (Google Maps)'
        meta_description: 'Crea un código QR gratuito que inicia la navegación hasta tu dirección, en coche, a pie, en bici o en transporte público. Descarga en PNG y SVG.'
        form_title: 'Tu destino'
        intro: 'El escaneo no solo muestra un punto en el mapa: inicia la navegación hasta tu dirección, en el modo de desplazamiento que elijas.'
        copy_title: 'Enseñar un lugar o llevar a la gente hasta él'
        copy_body: |
            <p>Hay dos formas de enviar a alguien a un sitio. Un código de <em>ubicación</em> pone un punto en el mapa: perfecto para un punto de encuentro. Un código de <em>cómo llegar</em> inicia la ruta desde donde esté la persona: perfecto para una tienda, una sala, un muelle de carga o un estand.</p>
            <p>Escribe una dirección postal, el nombre de un lugar o unas coordenadas GPS. El enlace usa el formato universal de Google Maps, que abre la aplicación en Android y la aplicación o la versión web en iPhone. El modo de desplazamiento es una sugerencia: se puede cambiar con un toque.</p>
            <p>Imprímelo en el escaparate, en un albarán, en una invitación o al pie de un cartel. Y en papel, mantén la dirección postal escrita junto al código: tranquiliza antes de escanear y sigue sirviendo a quien no tiene el móvil a mano.</p>

howto:
    title: 'Cómo crear tu %tool% en tres pasos'
    step1:
        title: 'Rellena el formulario'
        text: 'Introduce tus datos en los campos de arriba. La vista previa se actualiza mientras escribes, así que compruebas el resultado al momento.'
    step2:
        title: 'Ajusta el aspecto'
        text: 'Abre las opciones avanzadas para cambiar los colores, el margen y el nivel de corrección de errores. Más corrección significa un código que se lee aunque esté parcialmente tapado o dañado.'
    step3:
        title: 'Descárgalo y úsalo'
        text: 'Exporta PNG para pantallas, SVG para imprenta o WebP para el archivo más ligero. El código es tuyo, gratis, sin marca de agua y sin caducidad.'

faq:
    title: 'Preguntas frecuentes'
    free:
        q: '¿Este generador es realmente gratuito?'
        a: 'Sí. Todos los generadores del sitio son gratuitos e ilimitados, sin cuenta y sin marca de agua. El sitio se financia con publicidad, por eso los anuncios solo se cargan después de que los aceptes.'
    expire:
        q: '¿Los códigos caducan?'
        a: 'Nunca. Los códigos son estáticos: el contenido está escrito en el patrón, no guardado en nuestros servidores. Una vez descargado, el código sigue funcionando aunque este sitio desaparezca.'
    commercial:
        q: '¿Puedo usar los códigos comercialmente?'
        a: 'Sí, sin restricciones: envases, carteles, tarjetas de visita, productos a la venta. La imagen generada es tuya y no te cuesta nada, sin regalías ni atribución.'
    print:
        q: '¿A qué tamaño debo imprimir un código?'
        a: 'Una regla práctica: el código debe medir al menos una décima parte de la distancia de escaneo. Para escanear a 50 cm, imprime al menos 5 cm de ancho. Exporta siempre el SVG, conserva el margen y prueba con dos o tres teléfonos.'
    url:
        q: '¿Puedo cambiar después el destino de mi código QR?'
        a: 'No en un código estático: la URL está en el patrón. Si prevés cambiarla, codifica un enlace que controles (tu propio dominio, una página que redirige) para cambiar la redirección en lugar de reimprimir.'
    text:
        q: '¿Cuánto texto cabe en un código QR?'
        a: 'Técnicamente hasta unos 4000 caracteres, pero la legibilidad cae rápido. Quédate por debajo de 300 caracteres para un escaneo instantáneo y sube la corrección de errores si te pasas.'
    wifi:
        q: '¿Qué teléfonos pueden conectarse a una red con un código QR?'
        a: 'Los iPhone desde iOS 11 y los Android desde la versión 10 lo hacen de forma nativa desde la cámara. Los Android más antiguos pueden necesitar una aplicación de lectura compatible con Wi-Fi.'
    vcard:
        q: '¿Qué formato se usa para la tarjeta de contacto?'
        a: 'vCard 3.0, el formato compatible con iOS, Android, Outlook, Gmail y todas las agendas habituales. No hay que instalar nada en el teléfono de la otra persona.'
    email:
        q: '¿El escaneo envía el correo automáticamente?'
        a: 'No, y es intencionado: el escaneo abre la aplicación de correo con todo rellenado y la persona pulsa enviar. Todavía puede editar el mensaje antes.'
    sms:
        q: '¿El SMS tiene coste para quien escanea?'
        a: 'El mensaje sale de su propio teléfono, así que se aplica su tarifa habitual. Este sitio no cobra nada y el código funciona incluso sin datos.'
    phone:
        q: '¿La llamada se inicia sola?'
        a: 'No. El escaneo abre el marcador con el número ya escrito y la persona pulsa el botón de llamar. Es una norma de seguridad de iOS y Android.'
    whatsapp:
        q: '¿Hace falta una cuenta de WhatsApp Business?'
        a: 'No. El código abre una conversación wa.me estándar que funciona con cualquier cuenta de WhatsApp, personal o profesional.'
    geo:
        q: '¿Qué aplicación se abre al escanear?'
        a: 'La aplicación de mapas predeterminada del teléfono: Mapas en iOS, Google Maps en la mayoría de Android. Las coordenadas se transmiten en el formato estándar geo:.'
    barcode:
        q: '¿Puedo inventarme un número EAN-13?'
        a: 'No para la venta en tienda. Un EAN-13 comercializado debe proceder de un prefijo GS1 asignado a tu empresa. Para uso interno —inventario, activos, logística— puedes numerar libremente, y el Code 128 suele encajar mejor.'
    event:
        q: '¿Qué calendarios aceptan el código?'
        a: 'El escaneo abre el calendario nativo de iOS y Android, que después sincroniza con Google Calendar, iCloud u Outlook como siempre. El formato codificado es el VEVENT estándar.'
    review:
        q: '¿Puedo enseñar el código solo a los clientes contentos?'
        a: 'No. Filtrar a quién se invita a dejar reseña incumple las políticas de Google y puede suspender tu perfil. Enseña el mismo código a todo el mundo y pídelo cuando el servicio ha ido bien.'
    bitcoin:
        q: '¿El importe queda fijado en el código?'
        a: 'Es una sugerencia: el monedero lo rellena y el pagador aún puede cambiarlo antes de firmar. Deja el campo vacío para una donación y rellénalo para una factura.'
    sepa:
        q: '¿Qué bancos leen un GiroCode?'
        a: 'La mayoría de las aplicaciones bancarias de Alemania, Austria, Países Bajos, Bélgica y Finlandia lo hacen de forma nativa, y cada vez más en el resto de Europa. Donde no se admite, el escaneo solo muestra el texto: añadirlo no cuesta nada.'
    totp:
        q: '¿Es seguro generar aquí un código 2FA?'
        a: 'El secreto se usa para construir la imagen y luego se descarta: nunca se guarda. Dicho esto, un secreto TOTP es una credencial: no publiques nunca un código creado con un secreto real y cámbialo si se filtra.'
    crypto:
        q: '¿Qué cadenas se admiten?'
        a: 'Ethereum (EIP-681), Litecoin, Dogecoin, Bitcoin Cash, Dash (BIP-21), Monero y Solana Pay. Bitcoin tiene su propio generador. La dirección se valida según la cadena seleccionada.'
    telegram:
        q: '¿Funciona con un canal o un bot?'
        a: 'Sí. Cualquier nombre de usuario público funciona: cuenta personal, canal, grupo o bot. Un número en formato internacional también sirve.'
    signal:
        q: '¿El código revela mi número de teléfono?'
        a: 'Sí: Signal identifica las cuentas por número, así que va en el enlace. Publica solo un número que aceptes hacer público.'
    directions:
        q: '¿Funciona sin Google Maps instalado?'
        a: 'Sí. En un móvil sin la aplicación, el enlace abre la versión web de Google Maps, que ofrece la misma ruta.'

