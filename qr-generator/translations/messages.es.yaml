tool:
    other_tools: 'Otros generadores gratuitos'
    qrcode:
        name: 'Generador de códigos QR'
        object: 'código QR'
        form_title: '¿Qué debe contener el código?'
    text:
        name: 'Generador de código QR de texto'
        object: 'código QR de texto'
        short: 'Codifica texto libre, legible sin conexión.'
        meta_title: 'Generador gratuito de código QR de texto'
        meta_description: 'Codifica cualquier texto en un código QR gratuito: un mensaje, un número de serie o unas instrucciones. Descarga en PNG, SVG y WebP.'
        form_title: 'Tu texto'
        intro: 'Codifica un mensaje, una referencia o unas instrucciones. El texto se guarda en el propio código y se lee sin conexión.'
        copy_title: 'Cuándo el texto es mejor que un enlace'
        copy_body: |
            <p>Un código QR de texto no necesita red: el teléfono muestra el contenido de inmediato, incluso en un sótano, un almacén o un avión. Es ideal para números de serie, instrucciones de mantenimiento, referencias de estantería o los datos de un evento.</p>
            <p>Sé breve. Por debajo de unos 300 caracteres el patrón resulta cómodo de escanear; por encima de 1000 se vuelve denso y exige mayor tamaño de impresión y más corrección de errores.</p>
    wifi:
        name: 'Generador de código QR de Wi-Fi'
        object: 'código QR de Wi-Fi'
        short: 'Tus invitados se conectan sin escribir la contraseña.'
        meta_title: 'Generador gratuito de código QR para Wi-Fi'
        meta_description: 'Crea un código QR de Wi-Fi gratis: tus invitados lo escanean y se conectan sin escribir la contraseña. Compatible con iOS y Android. PNG y SVG.'
        form_title: 'Tu red Wi-Fi'
        intro: 'Imprime el código y cuélgalo en la pared: los invitados lo escanean y se conectan sin ver nunca la contraseña.'
        copy_title: 'La forma correcta de compartir una red Wi-Fi'
        copy_body: |
            <p>Desde iOS 11 y Android 10, la cámara reconoce un código QR de Wi-Fi y propone unirse a la red con un toque. Hoteles, cafeterías, espacios de coworking, salas de espera y apartamentos turísticos lo usan para dejar de dictar contraseñas de veinte caracteres.</p>
            <p>Escribe el nombre de la red exactamente como se emite: los SSID distinguen mayúsculas y minúsculas. Elige WPA para cualquier router moderno y marca «red oculta» solo si el SSID realmente no se difunde.</p>
    vcard:
        name: 'Generador de código QR vCard'
        object: 'código QR vCard'
        short: 'Comparte tus datos de contacto en un escaneo.'
        meta_title: 'Generador gratuito de código QR vCard (tarjeta de contacto)'
        meta_description: 'Crea un código QR vCard gratis con tu nombre, teléfono, correo y empresa. Un escaneo y estás en su agenda. Descarga en PNG y SVG.'
        form_title: 'Tus datos de contacto'
        intro: 'Un escaneo y tus datos llegan directamente a la agenda de la otra persona, sin teclear y sin errores.'
        copy_title: 'La tarjeta de visita que sobrevive al bolsillo'
        copy_body: |
            <p>Un código QR vCard codifica un archivo de contacto estándar (vCard 3.0) que entienden iOS, Android, Outlook y todas las agendas modernas. Imprímelo en tu tarjeta, en la firma del correo, en una acreditación de feria o en un escaparate.</p>
            <p>Incluye solo lo que quieras hacer público: nombre, teléfono, correo profesional y sitio web suelen bastar. Cuantos menos campos, más ligero el patrón y más rápido el escaneo.</p>
    whatsapp:
        name: 'Generador de código QR de WhatsApp'
        object: 'código QR de WhatsApp'
        short: 'Abre una conversación de WhatsApp al instante.'
        meta_title: 'Generador gratuito de código QR de WhatsApp'
        meta_description: 'Crea un código QR gratuito que abre una conversación de WhatsApp con un mensaje ya escrito. Sin cuenta de WhatsApp Business. PNG y SVG.'
        form_title: 'Tu conversación de WhatsApp'
        intro: 'El escaneo abre una conversación de WhatsApp con tu número y, si quieres, un mensaje listo para enviar.'
        copy_title: 'Una conversación en lugar de un formulario'
        copy_body: |
            <p>WhatsApp se ha convertido en el canal de atención por defecto en buena parte de Europa y de América Latina. Un código QR que abre una conversación ya iniciada («Hola, quiero un presupuesto para…») convierte mucho mejor que un formulario que nadie quiere rellenar en el móvil.</p>
            <p>Este generador crea un enlace wa.me estándar: funciona igual con una cuenta personal que con WhatsApp Business, sin suscripción ni verificación.</p>
howto:
    title: 'Cómo crear tu %tool% en tres pasos'
    step1:
        title: 'Rellena el formulario'
        text: 'Introduce tus datos en los campos de arriba. La vista previa se actualiza mientras escribes, así que compruebas el resultado al momento.'
    step2:
        title: 'Ajusta el aspecto'
        text: 'Abre las opciones avanzadas para cambiar los colores, el margen y el nivel de corrección de errores. Más corrección significa un código que se lee aunque esté parcialmente tapado o dañado.'
    step3:
        title: 'Descárgalo y úsalo'
        text: 'Exporta PNG para pantallas, SVG para imprenta o WebP para el archivo más ligero. El código es tuyo, gratis, sin marca de agua y sin caducidad.'

faq:
    title: 'Preguntas frecuentes'
    free:
        q: '¿Este generador es realmente gratuito?'
        a: 'Sí. Todos los generadores del sitio son gratuitos e ilimitados, sin cuenta y sin marca de agua. El sitio se financia con publicidad, por eso los anuncios solo se cargan después de que los aceptes.'
    expire:
        q: '¿Los códigos caducan?'
        a: 'Nunca. Los códigos son estáticos: el contenido está escrito en el patrón, no guardado en nuestros servidores. Una vez descargado, el código sigue funcionando aunque este sitio desaparezca.'
    commercial:
        q: '¿Puedo usar los códigos comercialmente?'
        a: 'Sí, sin restricciones: envases, carteles, tarjetas de visita, productos a la venta. La imagen generada es tuya y no te cuesta nada, sin regalías ni atribución.'
    print:
        q: '¿A qué tamaño debo imprimir un código?'
        a: 'Una regla práctica: el código debe medir al menos una décima parte de la distancia de escaneo. Para escanear a 50 cm, imprime al menos 5 cm de ancho. Exporta siempre el SVG, conserva el margen y prueba con dos o tres teléfonos.'
    text:
        q: '¿Cuánto texto cabe en un código QR?'
        a: 'Técnicamente hasta unos 4000 caracteres, pero la legibilidad cae rápido. Quédate por debajo de 300 caracteres para un escaneo instantáneo y sube la corrección de errores si te pasas.'
    wifi:
        q: '¿Qué teléfonos pueden conectarse a una red con un código QR?'
        a: 'Los iPhone desde iOS 11 y los Android desde la versión 10 lo hacen de forma nativa desde la cámara. Los Android más antiguos pueden necesitar una aplicación de lectura compatible con Wi-Fi.'
    vcard:
        q: '¿Qué formato se usa para la tarjeta de contacto?'
        a: 'vCard 3.0, el formato compatible con iOS, Android, Outlook, Gmail y todas las agendas habituales. No hay que instalar nada en el teléfono de la otra persona.'
    whatsapp:
        q: '¿Hace falta una cuenta de WhatsApp Business?'
        a: 'No. El código abre una conversación wa.me estándar que funciona con cualquier cuenta de WhatsApp, personal o profesional.'
